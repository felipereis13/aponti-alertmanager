global:
  resolve_timeout: 5m

route:
  receiver: "default-webhook"
  group_by: ["alertname", "service", "severity"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 3h

  routes:
    # Severidade crítica
    - matchers:
        - severity = critical
      receiver: "critical-webhook"
      continue: false

    # Severidade de aviso
    - matchers:
        - severity = warning
      receiver: "default-webhook"

receivers:
  - name: "default-webhook"
    webhook_configs:
      - url: "http://api:3000/api/alerts/webhook"
        send_resolved: true

  - name: "critical-webhook"
    webhook_configs:
      - url: "http://api:3000/api/alerts/webhook"
        send_resolved: true
    # Slack opcional
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
    #     channel: "#alertas-criticos"
    #     send_resolved: true
    #     title: "{{ .CommonLabels.alertname }}"
    #     text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

inhibit_rules:
  # ApiDown silencia alertas secundários
  - source_matchers:
      - alertname = ApiDown
    target_matchers:
      - severity =~ "warning|critical"
    equal: ["service"]