global:
  scrape_interval: 15s          
  evaluation_interval: 15s
  external_labels:
    monitor: "monitor"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093  

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  # Coleta interna
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
          environment: "development"

  # Coleta HTTP
  - job_name: "node_api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: "api"
          environment: "development"
